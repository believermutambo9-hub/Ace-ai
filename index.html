    <script>
      // Browser-safe Buffer fallback for client runtime
      if (typeof window !== 'undefined' && typeof window.Buffer === 'undefined') {
        window.Buffer = {
          isBuffer: function() { return false; },
          from: function(data) {
            if (typeof data === 'string') return new TextEncoder().encode(data);
            return new Uint8Array(data);
          },
          alloc: function(size) { return new Uint8Array(size); },
        };
      }
      // Ignore WebSocket disconnection errors in iframe preview
      function isViteWsError(msg) {
        if (typeof msg !== 'string') return false;
        return (
          msg.includes('WebSocket') ||
          msg.includes('vite:ws') ||
          msg.includes('createWebSocketModuleRunnerTransport')
        );
      }
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (isViteWsError(msg)) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e ? (e.message || (e.error && e.error.message) || '') : '';
        if (isViteWsError(msg)) {
          e.preventDefault();
        }
      });
    </script>
